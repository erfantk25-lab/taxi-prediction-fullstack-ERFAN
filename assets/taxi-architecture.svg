<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="t d"><title id="t">Taxi fare prediction application architecture</title><desc id="d">Streamlit frontend obtains driving route data from OpenRouteService, sends trip features to FastAPI, which runs a scikit-learn regression pipeline and returns a fare prediction. Training saves a Joblib artifact and metadata.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020916"/><stop offset=".56" stop-color="#061d36"/><stop offset="1" stop-color="#082b49"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8bcdf0" stroke-opacity=".07"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" stroke="#00dfff" fill="none" stroke-width="1.6"/></marker></defs><rect width="1500" height="520" rx="24" fill="url(#bg)"/><rect width="1500" height="520" rx="24" fill="url(#grid)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="54" fill="#00dfff" font-size="15" font-weight="750" letter-spacing="4">EF / PROJECT ARCHITECTURE</text><text x="48" y="94" fill="#f5f8ff" font-size="27" font-weight="750">Route-aware prediction from user input to fare</text><text x="48" y="122" fill="#c5dced" font-size="14">Individual full-stack machine-learning application</text></g><rect x="30" y="180" width="220" height="132" rx="15" fill="#071b31" stroke="#087eae"/><text x="47" y="207" fill="#00dfff" font-size="12" font-family="Inter,Arial" font-weight="750">01</text><text x="47" y="246" fill="#f5f8ff" font-size="14" font-family="Inter,Arial" font-weight="750">STREAMLIT UI</text><text x="47" y="277" fill="#9fb4ca" font-size="12" font-family="Inter,Arial">addresses · passengers</text><rect x="274" y="180" width="220" height="132" rx="15" fill="#071b31" stroke="#087eae"/><text x="291" y="207" fill="#00dfff" font-size="12" font-family="Inter,Arial" font-weight="750">02</text><text x="291" y="246" fill="#f5f8ff" font-size="14" font-family="Inter,Arial" font-weight="750">ROUTE SERVICE</text><text x="291" y="277" fill="#9fb4ca" font-size="12" font-family="Inter,Arial">OpenRouteService</text><rect x="518" y="180" width="220" height="132" rx="15" fill="#071b31" stroke="#087eae"/><text x="535" y="207" fill="#00dfff" font-size="12" font-family="Inter,Arial" font-weight="750">03</text><text x="535" y="246" fill="#f5f8ff" font-size="14" font-family="Inter,Arial" font-weight="750">FEATURE PAYLOAD</text><text x="535" y="277" fill="#9fb4ca" font-size="12" font-family="Inter,Arial">distance · duration · rates</text><rect x="762" y="180" width="220" height="132" rx="15" fill="#071b31" stroke="#087eae"/><text x="779" y="207" fill="#00dfff" font-size="12" font-family="Inter,Arial" font-weight="750">04</text><text x="779" y="246" fill="#f5f8ff" font-size="14" font-family="Inter,Arial" font-weight="750">FASTAPI</text><text x="779" y="277" fill="#9fb4ca" font-size="12" font-family="Inter,Arial">POST /predict</text><rect x="1006" y="180" width="220" height="132" rx="15" fill="#071b31" stroke="#087eae"/><text x="1023" y="207" fill="#00dfff" font-size="12" font-family="Inter,Arial" font-weight="750">05</text><text x="1023" y="246" fill="#f5f8ff" font-size="14" font-family="Inter,Arial" font-weight="750">REGRESSION MODEL</text><text x="1023" y="277" fill="#9fb4ca" font-size="12" font-family="Inter,Arial">scikit-learn pipeline</text><rect x="1250" y="180" width="220" height="132" rx="15" fill="#071b31" stroke="#087eae"/><text x="1267" y="207" fill="#00dfff" font-size="12" font-family="Inter,Arial" font-weight="750">06</text><text x="1267" y="246" fill="#f5f8ff" font-size="14" font-family="Inter,Arial" font-weight="750">PREDICTION</text><text x="1267" y="277" fill="#9fb4ca" font-size="12" font-family="Inter,Arial">fare in SEK</text><g stroke="#00dfff" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M250 245h16"/><path d="M494 245h16"/><path d="M738 245h16"/><path d="M982 245h16"/><path d="M1226 245h16"/></g><rect x="30" y="360" width="1440" height="104" rx="16" fill="#041a2e" stroke="#0b6f9c" stroke-dasharray="7 6"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="54" y="390" fill="#00dfff" font-size="13" font-weight="750" letter-spacing="2">MODEL TRAINING & DISPLAY</text><text x="54" y="416" fill="#c5dced" font-size="13">Offline training evaluates candidates and saves the selected pipeline and metadata</text><rect x="675" y="385" width="230" height="52" rx="10" fill="#071b31" stroke="#087eae"/><text x="790" y="406" text-anchor="middle" fill="#f5f8ff" font-size="13" font-weight="700">Joblib model + metadata</text><text x="790" y="423" text-anchor="middle" fill="#9fb4ca" font-size="11">loaded by FastAPI</text><rect x="980" y="385" width="230" height="52" rx="10" fill="#071b31" stroke="#087eae"/><text x="1095" y="406" text-anchor="middle" fill="#f5f8ff" font-size="13" font-weight="700">Streamlit result</text><text x="1095" y="423" text-anchor="middle" fill="#9fb4ca" font-size="11">Folium route map</text></g><g stroke="#00dfff" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M905 411h65"/><path d="M1210 411h95v-86"/></g><text x="1440" y="498" text-anchor="end" fill="#729cbd" font-family="Inter,Arial" font-size="11" letter-spacing="2">ERFAN TAHMASEBI · MLOPS</text></svg>